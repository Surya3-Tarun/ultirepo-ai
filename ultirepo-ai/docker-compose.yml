version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ultirepo-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ultirepo-storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ultirepo-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ultirepo-storage:
