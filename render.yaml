services:
  - type: web
    name: ultirepo-backend
    runtime: docker
    rootDir: ultirepo-ai/backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: local

  - type: web
    name: ultirepo-frontend
    runtime: static
    rootDir: ultirepo-ai/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ultirepo-backend.onrender.com/*
      - type: rewrite
        source: /ws/*
        destination: https://ultirepo-backend.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
